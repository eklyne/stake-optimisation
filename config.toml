# stake-optimisation
#
# Win rates, hand counts and standard deviations are REAL, from
# stake_optimisation_inputs.csv (453,523 hands across the six rungs), with the
# exceptions flagged at the stakes themselves.
#
# THAT FILE IS GENERATED, not typed: nemesis-mvp/55_export_stake_inputs.py reads
# the hand histories straight out of DuckDB and prints these blocks ready to
# paste. It holds itself to nemesis's own 02_metrics/player_stats.sql (the
# oracle) with a parity assertion on hands, bb/100 and rake/100, so a number
# here can be stale, but it can no longer be a transcription error. See
# "Refreshing the inputs" in README.md. The three PokerTracker CSVs beside this
# file (stake_data.csv, july_stake_dist.csv, aug_stake_dist.csv) are the
# superseded hand-transcribed source, kept only as the historical record.
#
# WIN RATES ARE ALL-IN ADJUSTED (the "All-In Adj BB/100" column), not won-at-
# showdown. All-in EV strips the luck out of the spots where the money went in
# and the cards had not run out, so it converges faster and is the better
# estimate of the edge. Note it is paired below with the standard deviation of
# ACTUAL results, which is the wider of the two - the conservative direction.

# --- currency -------------------------------------------------------------- #
# The tables are EUR and the model computes in EUR throughout. This is a display
# skin: money you TYPE below (bankroll, downswing_amount) is read in this
# currency, and money you READ back - CLI, charts, deck, CSVs - is shown in it.
# Stake `bb_eur` values stay EUR, because that is what is written on the table.
#
# `fx_eur_per_unit` is the euros in ONE unit of the currency. It is a fixed
# constant you choose, never a live quote: a bankroll plan that moved with spot
# would not be a plan. Set currency = "EUR" to turn the whole thing off.
currency = "GBP"
fx_eur_per_unit = 1.16          # 1 GBP = 1.16 EUR

# --- the four inputs ------------------------------------------------------- #

bankroll = 40000               # 1. bankroll, in the currency above
tables = 12                    # 2. tables played simultaneously
                               # 4. risk tolerance: the [risk] block below

# Share of rake rebated, applied to each stake's `rake_bb100` below. Rakeback is
# a rebate on volume, not a gamble: it lifts the mean and adds NO variance, so it
# is pure improvement to the risk picture, not a trade-off.
rakeback_pct = 0.30

# 3. win rate and standard deviation per stake: the [[stake]] blocks below.
# 4. risk tolerance: the [risk] block, which sits BELOW the plain settings -
#    everything after a TOML table header belongs to that table.

# --- defaults you would rarely touch --------------------------------------- #

# Half Kelly, and there is no reason to touch it. "Full Kelly" is the exposure
# that maximises long-run growth, but it is far too hot to actually play: at that
# bankroll your risk of ruin is 13.5% and a 50%% drawdown is a coin flip. Halving
# it keeps three quarters of the growth for a quarter of the variance. And since
# growth is symmetric about the optimum while risk is not, being under is cheap
# and being over is not - so with a win rate you only ever ESTIMATE, you shade
# down. Only used by the `report` and `stake` commands; the mix ignores it.
kelly_fraction = 0.5

# From the data itself: 406,584 hands over 481.02 hours = 845 hands/hour in
# total, which at 12 tables is ~70 each. Only scales every EUR/hour uniformly, so
# it cannot change the ranking or the chosen mix.
#
# NOT refreshed alongside the stakes below, and cannot be: hand histories carry
# no session clock, so nemesis has no hours to divide by. This stays the one
# figure sourced from PokerTracker. It is also the one where that costs nothing,
# per the line above.
hands_per_hour_per_table = 70

# Both of the following are ASSUMPTIONS, not measurements. They default to zero,
# meaning the textbook independent case. Any non-zero value here is a number you
# chose to believe.
# THE TIMESCALE. Every simulated downswing figure in the deck covers this many
# hands - 1M is roughly a year of your volume (~1,190 hours at 12 tables).
#
# It is not a cosmetic setting. Peak-to-trough drawdown has no all-time value:
# given unlimited time it grows without bound, because a winning bankroll keeps
# making new highs to fall from. So every downswing number is "within this many
# hands" and means nothing without it. Change this and every downswing in the
# deck changes with it.
timescale_hands = 1000000
sim_paths = 20000

winrate_haircut_bb_per_table = 0.0  # bb/100 lost per table beyond the first
table_correlation = 0.0             # 0 = tables independent; raises effective
                                    # variance, and therefore the roll required

# --- risk tolerance -------------------------------------------------------- #
# Two ways to say how much risk is too much. `mode` picks the one that decides
# the answer; the other's numbers are still read, because the deck draws both
# frontier charts either way.
#
#   mode = "ruin"       P(the bankroll ever reaches zero) <= ruin_tolerance.
#                       Analytic and instant. An ALL-TIME, play-forever number:
#                       it treats every mix that survives as equally comfortable,
#                       so a mix that halves your roll twice a year and grinds it
#                       back counts as safe.
#
#   mode = "downswing"  P(a fall of downswing_amount or worse within
#                       downswing_hands) <= downswing_probability. What a losing
#                       stretch actually feels like, over a horizon you can
#                       picture. PEAK-TO-TROUGH - measured from whatever high the
#                       roll had reached, NOT from where you started. Costs a
#                       simulation per candidate, so `mix` takes a few seconds
#                       and shows a progress bar.
#
#   mode = "both"       BOTH bars must be cleared, so the stricter one decides.
#                       Which one that is changes on its own as the roll moves:
#                       ruin binds when the roll is small, and falls away to
#                       nothing as it grows, at which point the downswing rule
#                       takes over. You never have to work out which framing is
#                       the live one today.
#
# They are not two spellings of one constraint. On this bankroll a 0.01% ruin bar
# admits a mix that runs a GBP 33,600 peak-to-trough fall - ruin asks only whether
# you SURVIVE, and a fall that deep leaves you solvent and finished.
#
# The bankroll above is required in every mode: every chart needs a starting
# point, and ruin is reported alongside whichever rule binds.
#
# THIS BLOCK MUST STAY BELOW every plain top-level setting. A TOML table header
# captures everything after it, so a [risk] block moved up the file would quietly
# swallow `kelly_fraction`, `timescale_hands` and the rest.
[risk]
mode = "both"
ruin_tolerance = 0.0001        # 0.01% - one chance in 10,000 of ever busting
downswing_amount = 10000       # X - maximum acceptable downswing
downswing_hands = 1000000      # Y - number of hands in period (~a year)
downswing_probability = 0.10   # p - probability of having a downswing this bad

# --- stakes ---------------------------------------------------------------- #
# `hands` is optional. Supply it and you get a confidence interval and the
# shaded (conservative) sizing; omit it and the tool treats the win rate as
# known, which it never is.
#
# `max_tables` is also optional: the number of seats you can realistically get
# at this stake at once. Omit it for no limit. This is the constraint most
# likely to bind on the mix - without it the optimiser will cheerfully put four
# tables on a stake that rarely has four good games running. `max_tables = 0`
# excludes a stake entirely.

# Win rates below are the ALL-IN ADJUSTED figures (ALLIN_ADJ_BB100), and the
# standard deviations are the MEASURED ones - except where flagged.

# `current_hands` names one or more PERIODS OF ACTUAL PLAY, written oldest
# first, and the LAST one is what is being played now - it is the mix the deck
# simulates and argues against, while the earlier ones are drawn on the frontier
# charts and listed in the tables so the movement between them is visible.
# Both periods are the newest two calendar months in the hand histories,
# detected automatically - so next month's refresh produces August + September
# with no edit here beyond the paste.
#
# NOTE THE NEWEST MONTH IS USUALLY PARTIAL (this one runs to the 25th). That is
# fine and needs no correction: only the RATIO across stakes is ever used.
#
# BOTH periods now pool iPoker and WPN onto the EUR rungs of this ladder, so the
# WPN dollar tables ($0.50/$1/$2/$4/$6 NL) are counted on the euro rung of the
# same name. Until 2026-09 only August did, and July was iPoker-only - the two
# were not comparable, and the movement between them partly measured which
# export had been taken rather than what was played. The small FX gap between a
# $2 and a EUR2 table still does not enter any number here: it would only matter
# if these hands were being priced rather than counted.

[[stake]]
name = "50NL"
bb_eur = 0.50
winrate_bb100 = 9.74
stdev_bb100 = 92.36
rake_bb100 = 10.096
current_hands = { July = 24489, August = 17351 }
hands = 285582

[[stake]]
name = "100NL"
bb_eur = 1.00
winrate_bb100 = 5.77
stdev_bb100 = 91.66
rake_bb100 = 8.083
current_hands = { July = 12732, August = 12367 }
hands = 95202

# 5-max, 6-max and the WPN $2 tables all land on this one rung: same blinds,
# same money, so the allocator has no reason to treat them as separate. That
# pooling used to be arithmetic done by hand in this comment; it is now
# structural - nemesis buckets on the numeric big-blind size (lib/stakes.py),
# so every EUR2/USD2 table is a 200NL hand by construction and the win rate and
# standard deviation below are measured across the pooled sample directly.
[[stake]]
name = "200NL"
bb_eur = 2.00
winrate_bb100 = 3.05
stdev_bb100 = 91.72
rake_bb100 = 6.170
current_hands = { July = 15255, August = 16739 }
hands = 55054

# ASSUMED win rate - `measured_winrate_bb100` is what the sample actually says.
# 1.01 over 15,530 hands carries a 95% interval of +/-12.8, so 2.0 is a mildly
# optimistic reading well inside it, and NOT a measurement. The deck shows both,
# side by side, rather than drawing an interval around the assumption.
#
# It was 2.5 until 2026-09, against a then-measured 1.32. The extra 3,143 hands
# pulled the measurement DOWN to 1.01, so the assumption came down with it. Note
# the direction: this stake is the top of the ladder in EUR/100 and the sample
# keeps declining to confirm it.
#
# The standard deviation IS measured, and now actually says so - this line read
# 92.0 while the comment claimed it was measured, which it never was (the true
# figure was 79.93). 15,530 hands is ample for a second moment even though it is
# thin for a first. 81.24 is genuinely lower than the rest of the ladder, and
# lowering it pulls the optimiser toward this stake, so it is worth knowing that
# it is a measurement and not a convenience.
[[stake]]
name = "400NL"
bb_eur = 4.00
winrate_bb100 = 2.0
measured_winrate_bb100 = 1.01
stdev_bb100 = 81.24
rake_bb100 = 4.279
current_hands = { July = 4632, August = 6079 }
hands = 15530

# The next two win rates are ZERO BY ASSUMPTION - a deliberate "I do not have a
# win rate here", not a measurement of zero. The measured all-in figures (37.84
# and -8.82 bb/100, off 1,676 and 479 hands) are noise: the intervals are +/-40
# and +/-50, so the sample cannot tell a 10 bb/100 winner from a 10 bb/100 loser
# at either. Taken at face value the 600NL figure had the optimiser recommending
# a table of it for nothing.
#
# They were 2.0 and 1.5 until 2026-09, as conservative placeholders continuing
# the ladder's downward trend. Zero is the stronger statement and the honest
# one: extrapolating a trend line is still asserting an edge you have not seen.
#
# ZERO IS NOT EXCLUSION. `rates.total_winrate` adds rakeback on top of the win
# rate, and that rebate carries no variance, so 600NL still banks 0.30 x 3.509 =
# 1.05 bb/100 = EUR 6.32 per 100 hands - about level with 50NL's EUR 6.39. What
# keeps these two out of the mix is that they rank last of the six once the risk
# constraint prices their variance, NOT the zero itself. To take either off the
# ladder outright, set `max_tables = 0`.
#
# `hands` and `measured_winrate_bb100` are both recorded so the deck can show
# how little is behind them.
#
# THE STANDARD DEVIATIONS ARE ALSO ASSUMED at these two. The measured values are
# 84.18 over 1,676 hands and 56.05 over 479 - and 56.05 is not a low-variance
# stake, it is a stake where no big pot happened to occur yet. Feeding it in
# would make 1KNL look far safer than it is and pull the optimiser straight into
# it, which is the same trap the win rates set. 92.0 is used instead: in line
# with the three stakes that ARE well measured. The generator applies this rule
# itself, at a 5,000-hand floor, so it cannot be forgotten on a refresh.
[[stake]]
name = "600NL"
bb_eur = 6.00
winrate_bb100 = 0.0
measured_winrate_bb100 = 37.84
stdev_bb100 = 92.0
rake_bb100 = 3.509
current_hands = { July = 606, August = 1070 }
hands = 1676

[[stake]]
name = "1KNL"
bb_eur = 10.00
winrate_bb100 = 0.0
measured_winrate_bb100 = -8.82
stdev_bb100 = 92.0
rake_bb100 = 2.171
current_hands = { July = 10, August = 469 }
hands = 479
